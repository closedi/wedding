<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Свадьба Сергея и Анастасии</title>
    <meta
      name="description"
      content="Приглашение на свадьбу Сергея и Анастасии: программа, место проведения, подтверждение участия."
    />
	  <style>
		  /* Лоадер на весь экран */
		  #app-loader {
			  position: fixed;
			  top: 0; left: 0;
			  width: 100vw; height: 100vh;
			  background: #fff;
			  display: flex;
			  align-items: center;
			  justify-content: center;
			  z-index: 9999;
			  transition: opacity 0.3s ease;
		  }
		  #app-loader.hidden {
			  opacity: 0;
			  pointer-events: none;
		  }
		  /* Простой спиннер */
		  .spinner {
			  width: 48px; height: 48px;
			  border: 4px solid #e0e0e0;
			  border-top-color: #3b82f6;
			  border-radius: 50%;
			  animation: spin 1s linear infinite;
		  }
		  @keyframes spin {
			  to { transform: rotate(360deg); }
		  }
	  </style>
    <script type="module" crossorigin src="/wedding/assets/index-B4YB9L7k.js"></script>
    <link rel="stylesheet" crossorigin href="/wedding/assets/index-C_6IRT6C.css">
  </head>
  <body>
  <div id="app-loader">
	  <div class="spinner"></div>
  </div>
    <div id="root"></div>
  <script>
	  // Скрыть лоадер, когда всё загрузилось (шрифты, картинки, стили)
	  window.addEventListener('load', () => {
		  const loader = document.getElementById('app-loader');
		  if (loader) {
			  // Небольшая задержка для плавности
			  setTimeout(() => {
				  loader.classList.add('hidden');
				  // Полностью убрать из DOM после анимации
				  setTimeout(() => loader.remove(), 300);
			  }, 100);
		  }
	  });

	  // Fallback: если load не сработал за 10 сек — всё равно скрыть
	  setTimeout(() => {
		  const loader = document.getElementById('app-loader');
		  if (loader && !loader.classList.contains('hidden')) {
			  loader.classList.add('hidden');
			  setTimeout(() => loader.remove(), 300);
		  }
	  }, 10000);
  </script>
  </body>
</html>
